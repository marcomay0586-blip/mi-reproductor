<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor PWA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .upload-zone {
      border: 2px dashed #38bdf8;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    input[type="file"] { display: none; }
    button {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      padding: 12px 24px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .playlist {
      margin-top: 15px;
      text-align: left;
      max-height: 150px;
      overflow-y: auto;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>REPRODUCTOR PWA</h2>
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <p>⬆ Cargar música desde el teléfono</p>
      <small>Selecciona tus archivos MP3 o audio</small>
    </div>
    <input type="file" id="fileInput" accept="audio/*" multiple onchange="loadAudio(event)">

    <audio id="audioPlayer" style="width: 100%; margin-top: 10px;" controls></audio>

    <div class="playlist" id="playlist">
      <p>Sin música en lista</p>
    </div>
  </div>

  <script>
    const audioPlayer = document.getElementById('audioPlayer');
    const playlist = document.getElementById('playlist');

    function loadAudio(event) {
      const files = event.target.files;
      if (files.length > 0) {
        playlist.innerHTML = '<b>Lista de reproducción:</b><br>';
        audioPlayer.src = URL.createObjectURL(files[0]);
        audioPlayer.play();

        for (let i = 0; i < files.length; i++) {
          playlist.innerHTML += `<div>🎵 ${files[i].name}</div>`;
        }
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
